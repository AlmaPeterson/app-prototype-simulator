<div class="page">
    <button class="btn btn-secondary btn-sm mb-4" onclick="saveChangeOrder()">&larr; Change Orders</button>

    <div class="page-header">
        <div class="page-title" id="co-name-label"></div>
        <div class="page-subtitle" id="co-sub-label"></div>
    </div>

    <!-- Stats row -->
    <div id="co-stats" style="font-size:0.85rem; color:#475569; border:1px solid #e2e8f0; border-radius:6px; padding:10px 12px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:12px;"></div>

    <!-- Header fields -->
    <div class="card" style="cursor:default; padding:12px; margin-bottom:12px;">
        <div class="form-group" style="margin:0;">
            <label>Title</label>
            <input type="text" id="co-title">
        </div>
        <div class="form-group" style="margin:8px 0 0 0;">
            <label>Reason / Description of Change</label>
            <textarea id="co-desc" rows="2" placeholder="Why this change order exists..."></textarea>
        </div>
        <div class="form-group" style="margin:8px 0 0 0; max-width:50%;">
            <label>Expires</label>
            <input type="date" id="co-expires">
        </div>
    </div>

    <!-- Settings -->
    <div class="card" style="cursor:default; padding:12px; margin-bottom:16px;">
        <label style="font-size:0.75rem; color:#64748b; font-weight:600; display:block; margin-bottom:6px;">Billed Labor Rates ($/hr)</label>
        <div class="form-row">
            <div class="form-group" style="margin:0; flex:1;">
                <label>Master Specialist</label>
                <input type="number" id="co-rate-master" min="0" step="1">
            </div>
            <div class="form-group" style="margin:0; flex:1;">
                <label>Trade Professional</label>
                <input type="number" id="co-rate-fellow" min="0" step="1">
            </div>
            <div class="form-group" style="margin:0; flex:1;">
                <label>Support &amp; Prep</label>
                <input type="number" id="co-rate-apprentice" min="0" step="1">
            </div>
        </div>
        <p style="font-size:0.75rem; color:#64748b; margin:6px 0 0 0;" id="co-mileage-note"></p>
    </div>

    <!-- Tasks -->
    <div class="section-header">
        <span class="section-title">Tasks</span>
        <button class="section-action" onclick="window.addTask()">+ Add Task</button>
    </div>

    <div id="task-list"></div>

    <!-- Total -->
    <div id="co-totals"></div>

    <button class="btn btn-primary" style="margin-top:8px;" onclick="window.previewChangeOrder()">Preview &amp; Send &rarr;</button>
    <button class="btn btn-secondary" onclick="saveChangeOrder()">Save Draft</button>
</div>

<script>
(function initChangeOrderPage() {

    var co  = DB.getById('change_orders', state.currentChangeOrderId);
    var bid = DB.getById('bids', co.bid_id);
    var job = DB.getById('jobs', co.job_id);

    // Which existing divisions on the originating bid a task can be tagged
    // against — a change order isn't split into named divisions itself (see
    // app.js's Change Orders section comment for why), each task just
    // optionally points at one of the bid's divisions.
    var bidDivisions = DB.find('bid_divisions', function (d) { return d.bid_id === bid.id && !d.deleted_at; });

    var milesToSite = bid.miles_to_site || 0;
    var mileageRate = bid.mileage_rate || 0;

    document.getElementById('co-name-label').textContent = co.co_number || 'Change Order';
    document.getElementById('co-sub-label').textContent = (job ? job.name : '') + ' • Amends ' + (bid.bid_number || 'bid');
    document.getElementById('co-mileage-note').textContent = 'Mileage priced at ' + milesToSite + ' mi × $' + mileageRate.toFixed(2) + '/mi (set on the bid) × trips per task.';

    function buildTasksFromLineItems() {
        var items = DB.find('change_order_line_items', function (li) {
            return li.change_order_id === co.id && !li.deleted_at;
        }).slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });

        var groups = {};
        var order = [];
        items.forEach(function (li) {
            var key = li.task_key || ('__row_' + li.id);
            if (!groups[key]) { groups[key] = { labor: null, materials: [] }; order.push(key); }
            if (li.type === 'labor') groups[key].labor = li;
            else groups[key].materials.push(li);
        });

        return order.map(function (key) {
            var g = groups[key];
            var labor = g.labor || {};
            return {
                category: labor.task_category || '', name: labor.description || '',
                included: labor.task_included !== false, scope: labor.task_scope || '',
                qtyType: labor.qty_type || 'C', qty: labor.task_qty || 0,
                hrsEachMaster: labor.hrs_each_master || 0, hrsEachFellow: labor.hrs_each_fellow_craft || 0,
                hrsEachApprentice: labor.hrs_each_apprentice || 0, trips: labor.task_trips || 0,
                bidDivisionId: labor.bid_division_id || '',
                materials: g.materials.map(function (m) {
                    return { item: m.description || '', supplier: m.supplier || '', price: m.unit_cost || 0, qty: m.quantity || 0 };
                }),
            };
        });
    }

    var work = {
        title: co.title || '', description: co.description || '',
        rateMaster: co.labor_rate_master != null ? co.labor_rate_master : 500,
        rateFellow: co.labor_rate_fellow_craft != null ? co.labor_rate_fellow_craft : 300,
        rateApprentice: co.labor_rate_apprentice != null ? co.labor_rate_apprentice : 120,
        tasks: buildTasksFromLineItems(),
    };
    // Same window-scoped-handle pattern as bid-division.html's divWorking —
    // the task card markup is injected via innerHTML, so its inline
    // oninput/onclick attributes can't close over the local `work` var.
    window.coWorking = work;

    document.getElementById('co-title').value    = work.title;
    document.getElementById('co-desc').value     = work.description;
    document.getElementById('co-expires').value  = (co.expires_at || '').slice(0, 10);
    document.getElementById('co-rate-master').value     = work.rateMaster;
    document.getElementById('co-rate-fellow').value      = work.rateFellow;
    document.getElementById('co-rate-apprentice').value = work.rateApprentice;

    document.getElementById('co-title').addEventListener('input', function () { work.title = this.value; });
    document.getElementById('co-desc').addEventListener('input', function () { work.description = this.value; });
    document.getElementById('co-expires').addEventListener('input', function () { DB.update('change_orders', co.id, { expires_at: this.value }); });
    document.getElementById('co-rate-master').addEventListener('input',     function () { work.rateMaster = +this.value || 0; window.coRecalc(); });
    document.getElementById('co-rate-fellow').addEventListener('input',      function () { work.rateFellow = +this.value || 0; window.coRecalc(); });
    document.getElementById('co-rate-apprentice').addEventListener('input', function () { work.rateApprentice = +this.value || 0; window.coRecalc(); });

    function fmt(n) {
        return '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    }
    function esc(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function calcTask(t) {
        var hrsM = Math.round((t.qty || 0) * (t.hrsEachMaster     || 0) * 4) / 4;
        var hrsF = Math.round((t.qty || 0) * (t.hrsEachFellow      || 0) * 4) / 4;
        var hrsA = Math.round((t.qty || 0) * (t.hrsEachApprentice || 0) * 4) / 4;
        var hrs  = hrsM + hrsF + hrsA;
        var lc   = hrsM * (work.rateMaster || 0) + hrsF * (work.rateFellow || 0) + hrsA * (work.rateApprentice || 0);
        var mc   = (t.materials || []).reduce(function(s, m) { return s + (m.price||0)*(m.qty||0); }, 0);
        var mic  = (t.trips || 0) * milesToSite * mileageRate;
        return { hrsM: hrsM, hrsF: hrsF, hrsA: hrsA, hrs: hrs, lc: lc, mc: mc, mic: mic };
    }
    function calcTotals() {
        var labor = 0, mat = 0, mileage = 0;
        (work.tasks || []).forEach(function (t) {
            if (!t.included) return;
            var c = calcTask(t);
            labor += c.lc; mat += c.mc; mileage += c.mic;
        });
        // No contingency padding on a change order — it's a firm price for
        // a specific, already-negotiated scope, not a fresh estimate.
        return { labor: labor, mat: mat, mileage: mileage, total: labor + mat + mileage };
    }

    function updateStats() {
        var c = calcTotals();
        document.getElementById('co-stats').innerHTML =
            '<span>Total: <strong style="color:#0f172a;">' + fmt(c.total) + '</strong></span>' +
            '<span>Labor: <strong>' + fmt(c.labor) + '</strong></span>' +
            '<span>Materials: <strong>' + fmt(c.mat) + '</strong></span>' +
            '<span>Mileage: <strong>' + fmt(c.mileage) + '</strong></span>';

        (work.tasks || []).forEach(function (t, ti) {
            var tc = calcTask(t);
            var totEl = document.querySelector('[data-task-total="' + ti + '"]');
            if (totEl) totEl.textContent = fmt(tc.lc + tc.mc + tc.mic);
            (t.materials || []).forEach(function (m, mi) {
                var mEl = document.querySelector('[data-mat-total="' + ti + '-' + mi + '"]');
                if (mEl) mEl.textContent = fmt((m.price||0)*(m.qty||0));
            });
        });

        document.getElementById('co-totals').innerHTML =
            '<div style="border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin:12px 0;">' +
            '<div style="display:flex; justify-content:space-between; padding:3px 0; font-size:0.85rem;"><span>Labor Subtotal</span><span>' + fmt(c.labor) + '</span></div>' +
            '<div style="display:flex; justify-content:space-between; padding:3px 0; font-size:0.85rem;"><span>Materials Subtotal</span><span>' + fmt(c.mat) + '</span></div>' +
            '<div style="display:flex; justify-content:space-between; padding:3px 0 8px 0; font-size:0.85rem; border-bottom:1px solid #e2e8f0;"><span>Mileage Subtotal</span><span>' + fmt(c.mileage) + '</span></div>' +
            '<div style="display:flex; justify-content:space-between; padding:8px 0 0 0;"><strong>Change Order Total</strong><strong style="color:#0f172a; font-size:1.05rem;">' + fmt(c.total) + '</strong></div>' +
            '</div>';
    }
    window.coRecalc = updateStats;

    function divisionOptionsHTML(selectedId) {
        var html = '<option value=""' + (!selectedId ? ' selected' : '') + '>New / General Scope</option>';
        html += bidDivisions.map(function (d) {
            return '<option value="' + d.id + '"' + (d.id === selectedId ? ' selected' : '') + '>' + esc(d.division_name) + '</option>';
        }).join('');
        return html;
    }

    function buildMatsHTML(t, ti) {
        if (!t.materials || t.materials.length === 0) {
            return '<p style="font-size:0.78rem; color:#94a3b8; margin:4px 0;">No materials yet.</p>';
        }
        return t.materials.map(function (m, mi) {
            return '<div style="border:1px solid #e2e8f0; border-radius:4px; padding:8px; margin-bottom:6px; position:relative;">' +
                '<button onclick="window.removeMaterial(' + ti + ',' + mi + ')" ' +
                'style="position:absolute; top:4px; right:6px; background:none; border:none; cursor:pointer; color:#94a3b8; font-size:1rem; padding:0; line-height:1;">&times;</button>' +
                '<div class="form-row" style="margin-bottom:6px;">' +
                '<div class="form-group" style="margin:0; flex:2;"><label>Item</label>' +
                '<input type="text" value="' + esc(m.item) + '" placeholder="Item name" oninput="window.coWorking.tasks[' + ti + '].materials[' + mi + '].item=this.value;"></div>' +
                '<div class="form-group" style="margin:0; flex:1;"><label>Supplier</label>' +
                '<input type="text" value="' + esc(m.supplier) + '" placeholder="Supplier" oninput="window.coWorking.tasks[' + ti + '].materials[' + mi + '].supplier=this.value;"></div>' +
                '</div>' +
                '<div class="form-row" style="align-items:center;">' +
                '<div class="form-group" style="margin:0; flex:1;"><label>Price</label>' +
                '<input type="number" min="0" step="0.01" value="' + (m.price||'') + '" placeholder="0.00" oninput="window.coWorking.tasks[' + ti + '].materials[' + mi + '].price=+this.value; window.coRecalc();"></div>' +
                '<div class="form-group" style="margin:0; flex:1;"><label>Qty</label>' +
                '<input type="number" min="0" step="1" value="' + (m.qty||'') + '" placeholder="0" oninput="window.coWorking.tasks[' + ti + '].materials[' + mi + '].qty=+this.value; window.coRecalc();"></div>' +
                '<div style="padding-top:18px; min-width:64px; text-align:right;"><strong data-mat-total="' + ti + '-' + mi + '">' + fmt((m.price||0)*(m.qty||0)) + '</strong></div>' +
                '</div></div>';
        }).join('');
    }

    function buildTaskCard(t, ti) {
        var tc = calcTask(t);
        return '<div style="border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin-bottom:10px;">' +
            '<div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:10px;">' +
            '<input type="checkbox"' + (t.included ? ' checked' : '') +
            ' style="width:16px; height:16px; margin-top:3px; flex-shrink:0;"' +
            ' onchange="window.coWorking.tasks[' + ti + '].included=this.checked; window.coRecalc();">' +
            '<div style="flex:1; min-width:0;">' +
            '<select style="font-size:0.75rem; color:#64748b; border:none; background:transparent; width:100%; padding:0; outline:none;"' +
            ' oninput="window.coWorking.tasks[' + ti + '].bidDivisionId=this.value;">' + divisionOptionsHTML(t.bidDivisionId) + '</select>' +
            '<input type="text" value="' + esc(t.name) + '" placeholder="Task name" ' +
            'style="font-size:0.92rem; font-weight:600; border:none; background:transparent; width:100%; padding:2px 0 0 0; outline:none;"' +
            ' oninput="window.coWorking.tasks[' + ti + '].name=this.value;">' +
            '</div>' +
            '<strong data-task-total="' + ti + '" style="white-space:nowrap; color:#0f172a;">' + fmt(tc.lc + tc.mc + tc.mic) + '</strong>' +
            '<button onclick="window.removeTask(' + ti + ')" style="background:none; border:none; color:#94a3b8; font-size:1.1rem; cursor:pointer; padding:0; line-height:1;">&times;</button>' +
            '</div>' +
            '<div class="form-group" style="margin-bottom:10px;"><label>Scope of Task</label>' +
            '<textarea rows="2" placeholder="Describe the added/changed work..." oninput="window.coWorking.tasks[' + ti + '].scope=this.value;">' + esc(t.scope) + '</textarea></div>' +
            '<div style="border-top:1px solid #f1f5f9; padding-top:10px; margin-bottom:10px;">' +
            '<strong style="font-size:0.8rem; display:block; margin-bottom:8px;">Labor</strong>' +
            '<div class="form-row">' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Qty Type</label>' +
            '<select oninput="window.coWorking.tasks[' + ti + '].qtyType=this.value;">' +
            [['SF','Square Feet'],['LF','Linear Feet'],['C','Count'],['EA','Each'],['HR','Hours']].map(function(o){
                return '<option value="' + o[0] + '"' + (t.qtyType===o[0]?' selected':'') + '>' + o[1] + '</option>';
            }).join('') + '</select></div>' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Qty</label>' +
            '<input type="number" min="0" step="1" value="' + (t.qty||'') + '" placeholder="0" oninput="window.coWorking.tasks[' + ti + '].qty=+this.value; window.coRecalc();"></div>' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Trips</label>' +
            '<input type="number" min="0" step="1" value="' + (t.trips||'') + '" placeholder="0" title="Round trips to the job site" oninput="window.coWorking.tasks[' + ti + '].trips=+this.value; window.coRecalc();"></div>' +
            '</div>' +
            '<div class="form-row" style="margin-top:6px;">' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Master Specialist Hrs/Ea</label>' +
            '<input type="number" min="0" step="0.25" value="' + (t.hrsEachMaster||'') + '" placeholder="0" oninput="window.coWorking.tasks[' + ti + '].hrsEachMaster=+this.value; window.coRecalc();"></div>' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Trade Professional Hrs/Ea</label>' +
            '<input type="number" min="0" step="0.25" value="' + (t.hrsEachFellow||'') + '" placeholder="0" oninput="window.coWorking.tasks[' + ti + '].hrsEachFellow=+this.value; window.coRecalc();"></div>' +
            '<div class="form-group" style="margin:0; flex:1;"><label>Support &amp; Prep Hrs/Ea</label>' +
            '<input type="number" min="0" step="0.25" value="' + (t.hrsEachApprentice||'') + '" placeholder="0" oninput="window.coWorking.tasks[' + ti + '].hrsEachApprentice=+this.value; window.coRecalc();"></div>' +
            '</div>' +
            '<div style="display:flex; gap:16px; font-size:0.85rem; margin-top:4px; flex-wrap:wrap;">' +
            '<span>Total Hrs: <strong>' + tc.hrs.toFixed(2) + '</strong></span>' +
            '<span>Labor Cost: <strong>' + fmt(tc.lc) + '</strong></span>' +
            '<span>Mileage: <strong>' + fmt(tc.mic) + '</strong></span>' +
            '</div></div>' +
            '<div style="border-top:1px solid #f1f5f9; padding-top:10px;">' +
            '<strong style="font-size:0.8rem; display:block; margin-bottom:8px;">Materials</strong>' +
            '<div id="mats-' + ti + '">' + buildMatsHTML(t, ti) + '</div>' +
            '<button onclick="window.addMaterial(' + ti + ')" class="btn btn-secondary btn-sm" style="margin-top:4px;">+ Add Material</button>' +
            '</div></div>';
    }

    function renderTasks() {
        var list = document.getElementById('task-list');
        if (!work.tasks || work.tasks.length === 0) {
            list.innerHTML =
                '<div style="padding:20px; text-align:center; border:1px dashed #e2e8f0; border-radius:6px; margin-bottom:12px; color:#94a3b8;">' +
                '<p style="margin:0 0 10px 0;">No tasks yet.</p>' +
                '<button class="btn btn-primary btn-sm" onclick="window.addTask()">+ Add First Task</button>' +
                '</div>';
            updateStats();
            return;
        }
        list.innerHTML = work.tasks.map(buildTaskCard).join('');
        updateStats();
    }

    window.addTask = function () {
        work.tasks.push({
            category:'', name:'', included:true, scope:'', qtyType:'C', qty:0,
            hrsEachMaster:0, hrsEachFellow:0, hrsEachApprentice:0, trips:0, bidDivisionId:'', materials:[],
        });
        renderTasks();
    };
    window.removeTask = function (ti) { work.tasks.splice(ti, 1); renderTasks(); };
    window.addMaterial = function (ti) {
        work.tasks[ti].materials.push({ item:'', supplier:'', price:0, qty:0 });
        document.getElementById('mats-' + ti).innerHTML = buildMatsHTML(work.tasks[ti], ti);
        updateStats();
    };
    window.removeMaterial = function (ti, mi) {
        work.tasks[ti].materials.splice(mi, 1);
        document.getElementById('mats-' + ti).innerHTML = buildMatsHTML(work.tasks[ti], ti);
        updateStats();
    };

    // ── Save: flatten `work` back into real change_order_line_items rows
    // (same delete-old/insert-new pattern as bid-division.html's
    // saveDivision), recompute the change_orders rollup via
    // recalcChangeOrderTotals(), and persist the header fields.
    function persist() {
        var old = DB.find('change_order_line_items', function (li) {
            return li.change_order_id === co.id && !li.deleted_at;
        });
        old.forEach(function (li) { DB.softDelete('change_order_line_items', li.id); });

        var sortOrder = 0;
        work.tasks.forEach(function (t, ti) {
            var taskKey = 'task-' + ti;
            var tc = calcTask(t);
            DB.insert('change_order_line_items', {
                company_id: state.currentCompanyId, change_order_id: co.id,
                bid_division_id: t.bidDivisionId || null,
                description: t.name || '', quantity: tc.hrs, unit: 'hr',
                unit_cost: tc.hrs ? (tc.lc / tc.hrs) : 0, line_total: tc.lc,
                type: 'labor', sort_order: sortOrder++,
                task_key: taskKey, task_category: t.category || null, task_scope: t.scope || null,
                task_included: !!t.included, qty_type: t.qtyType || null, task_qty: t.qty || 0,
                hrs_each_master: t.hrsEachMaster || 0, hrs_each_fellow_craft: t.hrsEachFellow || 0,
                hrs_each_apprentice: t.hrsEachApprentice || 0, task_trips: t.trips || 0,
                supplier: null,
            });
            (t.materials || []).forEach(function (m) {
                DB.insert('change_order_line_items', {
                    company_id: state.currentCompanyId, change_order_id: co.id,
                    bid_division_id: t.bidDivisionId || null,
                    description: m.item || '', quantity: m.qty || 0, unit: 'each', unit_cost: m.price || 0,
                    line_total: (m.price || 0) * (m.qty || 0), type: 'material', sort_order: sortOrder++,
                    task_key: taskKey, task_category: null, task_scope: null,
                    task_included: null, qty_type: null, task_qty: null,
                    hrs_each_master: null, hrs_each_fellow_craft: null, hrs_each_apprentice: null, task_trips: null,
                    supplier: m.supplier || null,
                });
            });
        });

        DB.update('change_orders', co.id, {
            title: work.title || 'Change Order', description: work.description || '',
            labor_rate_master: work.rateMaster, labor_rate_fellow_craft: work.rateFellow, labor_rate_apprentice: work.rateApprentice,
        });
        recalcChangeOrderTotals(co.id);
    }

    // Shadows app.js's window.saveChangeOrder for as long as this page is
    // displayed (same pattern as bid-division.html's window.saveDivision).
    window.saveChangeOrder = function () {
        persist();
        loadPage('change-orders');
    };
    window.previewChangeOrder = function () {
        persist();
        previewChangeOrderProposal();
    };

    renderTasks();

})();
</script>
