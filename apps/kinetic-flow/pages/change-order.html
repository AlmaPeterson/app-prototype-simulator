<div class="page">
    <button class="btn btn-secondary btn-sm mb-4" onclick="saveChangeOrder()">&larr; Change Orders</button>

    <div class="page-header">
        <div class="page-title" id="co-name-label"></div>
        <div class="page-subtitle" id="co-sub-label"></div>
    </div>

    <!-- INTERNAL stats: billable vs pending vs excluded -->
    <div id="co-stats" class="card" style="cursor:default; font-size:0.82rem; padding:10px 12px; margin-bottom:16px;"></div>

    <!-- Header fields -->
    <div class="card" style="cursor:default; padding:12px; margin-bottom:12px;">
        <div class="form-group" style="margin:0;">
            <label>Title</label>
            <input type="text" id="co-title">
        </div>
        <div class="form-group" style="margin:8px 0 0 0;">
            <label>Reason / Description of Change</label>
            <textarea id="co-desc" rows="2" placeholder="Why this change order exists..."></textarea>
        </div>
        <div class="form-group" style="margin:8px 0 0 0; max-width:50%;">
            <label>Expires</label>
            <input type="date" id="co-expires">
        </div>
        <p style="font-size:0.72rem; color:#64748b; margin:8px 0 0;">New lines start as <b>PCO</b> (pending change order: priced, not billed). When the customer signs, PCO lines become this change order's own code. <b>VOID</b> and non-billable statuses (PUNCH-INT, WAR-RPR) never count toward the total.</p>
    </div>

    <div class="section-header">
        <span class="section-title">Scope of Change</span>
    </div>
    <div id="le-add"></div>
    <div id="le-lines"></div>

    <button class="btn btn-primary" style="margin-top:8px;" onclick="window.previewChangeOrder()">Preview &amp; Send &rarr;</button>
    <button class="btn btn-secondary" onclick="saveChangeOrder()">Save Draft</button>
</div>

<script>
(function initChangeOrderPage() {
    var coId = state.currentChangeOrderId;
    var co = DB.getById('change_orders', coId);
    var fmt = KFPricing.fmt;

    document.getElementById('co-name-label').textContent = co.co_number + ' — Change Order';
    document.getElementById('co-sub-label').textContent = 'Status: ' + co.status;
    document.getElementById('co-title').value = co.title || '';
    document.getElementById('co-desc').value = co.description || '';
    document.getElementById('co-expires').value = (co.expires_at || '').slice(0, 10);
    document.getElementById('co-title').addEventListener('input', function () { DB.update('change_orders', coId, { title: this.value }); });
    document.getElementById('co-desc').addEventListener('input', function () { DB.update('change_orders', coId, { description: this.value }); });
    document.getElementById('co-expires').addEventListener('input', function () { DB.update('change_orders', coId, { expires_at: this.value }); });

    function stats() {
        recalcChangeOrderTotals(coId);
        var r = computeChangeOrder(coId);
        document.getElementById('co-stats').innerHTML =
            '<div style="display:flex; flex-wrap:wrap; gap:12px;">' +
            '<span>Billable now: <b>' + fmt(r.total) + '</b></span><span>Pending (PCO): <b>' + fmt(r.pendingAmount) + '</b></span>' +
            '<span>Proposed total: <b>' + fmt(r.proposedTotal) + '</b></span><span>Excluded lines: <b>' + r.excludedCount + '</b></span></div>' +
            (r.needsPricingCount ? '<div style="margin-top:6px;"><span class="badge" style="background:#fef3c7; color:#92400e;">' + r.needsPricingCount + ' line(s) need pricing</span> not counted as $0.</div>' : '');
    }

    window.saveChangeOrder = function () { recalcChangeOrderTotals(coId); loadPage('change-orders'); };
    window.previewChangeOrder = function () { recalcChangeOrderTotals(coId); previewChangeOrderProposal(); };

    KFLE.mount({ table: 'change_order_line_items', parentField: 'change_order_id', parentId: coId, divisionNumber: null,
        defaultStatusCode: co.status === 'signed' ? co.co_number : 'PCO',
        statusCodes: ['PCO', 'FIELD-TM', 'ALLOW-RECON', 'PUNCH-INT', 'WAR-RPR', 'VOID', co.co_number], onChange: stats });
    stats();
})();
</script>
